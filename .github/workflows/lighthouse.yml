name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NODE_ENV: production

      - name: Setup Lighthouse CI
        run: npm install -g @lhci/cli@0.12.x

      - name: Run Lighthouse CI
        run: lhci autorun --config=.lighthouserc.json
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN || github.token }}

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30

      - name: Comment PR with Lighthouse results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            try {
              const resultsPath = '.lighthouseci/lhr-*.json';
              const files = require('glob').sync(resultsPath);

              if (files.length === 0) {
                console.log('No Lighthouse results found');
                return;
              }

              const results = files.map(file => JSON.parse(fs.readFileSync(file, 'utf-8')));
              const avg = {
                performance: Math.round(results.reduce((sum, r) => sum + r.categories.performance.score, 0) / results.length * 100),
                accessibility: Math.round(results.reduce((sum, r) => sum + r.categories.accessibility.score, 0) / results.length * 100),
                best_practices: Math.round(results.reduce((sum, r) => sum + r.categories['best-practices'].score, 0) / results.length * 100),
                seo: Math.round(results.reduce((sum, r) => sum + r.categories.seo.score, 0) / results.length * 100),
                pwa: Math.round(results.reduce((sum, r) => sum + r.categories.pwa.score, 0) / results.length * 100),
              };

              const comment = `
## Lighthouse Report

| Metric | Score |
|--------|-------|
| Performance | ${avg.performance} |
| Accessibility | ${avg.accessibility} |
| Best Practices | ${avg.best_practices} |
| SEO | ${avg.seo} |
| PWA | ${avg.pwa} |

Lighthouse results available in [artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).
              `;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment,
              });
            } catch (error) {
              console.error('Failed to post comment:', error);
            }
